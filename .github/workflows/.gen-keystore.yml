name: Generate Keystore

# اجرای دستی از تب Actions
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: ساخت keystore و رمزهای تصادفی
        run: |
          ALIAS="ucprovpn"
          # رمز تصادفی (برای PKCS12 رمز فایل و رمز کلید باید یکی باشد)
          PASS=$(openssl rand -hex 16)

          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=UC ProVpn, O=UC, C=IR"

          # نوشتن مقادیر Secret ها در یک فایل متنی (چاپ نمی‌شود در لاگ)
          {
            echo "KEY_ALIAS=$ALIAS"
            echo "KS_PASS=$PASS"
            echo "KEY_PASS=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w0 release.jks)"
          } > keystore-info.txt

      - name: آپلود به‌عنوان Artifact (فقط ۱ روز)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: keystore-info.txt
          retention-days: 1
