name: Replace Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          # پیدا کردن اولین فایل ZIP در ریشهٔ مخزن
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          # پاک‌سازی و ساخت پوشهٔ موقت
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          # اصلاح دسترسی‌ها: خواندن/نوشتن برای همه فایل‌ها و اجرا برای پوشه‌ها
          # (بدون این خط، cp روی فایل‌های بدون دسترسی خطای Permission denied می‌دهد)
          chmod -R u+rwX extracted

      - name: Detect project folder
        run: |
          # اگر داخل ZIP فقط یک پوشه وجود دارد، محتوای آن را به سطح بالا منتقل کن
          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            INNER=$(find extracted -mindepth 1 -maxdepth 1 -type d)
            cp -a "$INNER"/. extracted/
            rm -rf "$INNER"
          fi

      - name: Remove explicitly obsolete paths
        # فقط مسیرهای فهرست‌شده در اینجا حذف می‌شوند. هر چیز دیگری در مخزن
        # دست‌نخورده می‌ماند، حتی اگر در ZIP وجود نداشته باشد.
        run: |
          OBSOLETE_PATHS=(
            "android/app/src/main/java/com/lumen"
            "android/app/src/test/java/com/lumen"
            "android/bin/com/lumen"
            "android/core/config/src/main/java/com/lumen"
            "android/core/config/src/test/java/com/lumen"
            "android/core/database/src/main/java/com/lumen"
            "android/core/database/src/test/java/com/lumen"
            "android/core/engine/src/main/java/com/lumen"
            "android/core/engine/src/test/java/com/lumen"
            "android/core/vpn/src/main/java/com/lumen"
            "android/core/vpn/src/test/java/com/lumen"
            "android/ui/src/main/java/com/lumen"
            "android/ui/src/test/java/com/lumen"
            "android/bin"
            "android/app/src/main/res/drawable-night"
            "android/app/src/main/res/drawable/ic_launcher_dark_background.xml"
            "android/app/src/main/res/drawable/ic_launcher_dark_foreground.xml"
            "android/app/src/main/res/drawable/ic_launcher_light_background.xml"
            "android/app/src/main/res/drawable/ic_launcher_light_foreground.xml"
            "android/tools/assets"
            "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_dark.xml"
            "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_dark_round.xml"
            "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_light.xml"
            "android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_light_round.xml"
            "android/app/src/main/res/mipmap-hdpi/ic_launcher_dark.png"
            "android/app/src/main/res/mipmap-hdpi/ic_launcher_dark_round.png"
            "android/app/src/main/res/mipmap-hdpi/ic_launcher_light.png"
            "android/app/src/main/res/mipmap-hdpi/ic_launcher_light_round.png"
            "android/app/src/main/res/mipmap-mdpi/ic_launcher_dark.png"
            "android/app/src/main/res/mipmap-mdpi/ic_launcher_dark_round.png"
            "android/app/src/main/res/mipmap-mdpi/ic_launcher_light.png"
            "android/app/src/main/res/mipmap-mdpi/ic_launcher_light_round.png"
            "android/app/src/main/res/mipmap-xhdpi/ic_launcher_dark.png"
            "android/app/src/main/res/mipmap-xhdpi/ic_launcher_dark_round.png"
            "android/app/src/main/res/mipmap-xhdpi/ic_launcher_light.png"
            "android/app/src/main/res/mipmap-xhdpi/ic_launcher_light_round.png"
            "android/app/src/main/res/mipmap-xxhdpi/ic_launcher_dark.png"
            "android/app/src/main/res/mipmap-xxhdpi/ic_launcher_dark_round.png"
            "android/app/src/main/res/mipmap-xxhdpi/ic_launcher_light.png"
            "android/app/src/main/res/mipmap-xxhdpi/ic_launcher_light_round.png"
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_dark.png"
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_dark_round.png"
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_light.png"
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_light_round.png"
          )
          for p in "${OBSOLETE_PATHS[@]}"; do
            if [ -e "$p" ]; then
              echo "Removing obsolete: $p"
              rm -rf "$p"
            fi
          done

      - name: Overlay ZIP contents (never deletes anything else)
        run: |
          # کپی محتوای ZIP روی مخزن (چیز دیگری حذف نمی‌شود)
          cp -a extracted/. .
          rm -rf extracted
          rm -f "$ZIP"
          # اطمینان از قابل اجرا بودن gradlew (ممکن است ZIP این دسترسی را نداشته باشد)
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace project from ZIP"
          git push
