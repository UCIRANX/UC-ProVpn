name: Replace Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Detect project folder
        run: |
          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            INNER=$(find extracted -mindepth 1 -maxdepth 1 -type d)
            cp -a "$INNER"/. extracted/
            rm -rf "$INNER"
          fi

      - name: Replace project files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$(basename "$ZIP")" \
            ! -name "extracted" \
            -exec rm -rf {} +

          cp -a extracted/. .

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Replace project from ZIP"
          git push
