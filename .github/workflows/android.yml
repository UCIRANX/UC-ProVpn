name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # آیا کلید امضا در Secrets تنظیم شده؟ (true / false)
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # خواندن نسخه از constants.py برای ساخت تگ ریلیز
      - name: Determine version
        if: github.ref == 'refs/heads/main'
        run: |
          FILE="windows/xray_fluent/constants.py"
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' "$FILE" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "APP_VERSION not found"
            exit 1
          fi
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (tag: v$VERSION)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # کش Gradle و پیکربندی خودکار
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # با کلید امضا: نسخهٔ Release ساخته و بعد امضا می‌شود
      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # بدون کلید امضا: نسخهٔ Debug (قابل نصب ولی فقط برای تست)
      - name: Build debug APK (no signing key)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 تنظیم نشده؛ نسخهٔ Debug ساخته می‌شود."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # ساخت فایل keystore از Secret
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # پیدا کردن جدیدترین apksigner
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(find android -path "*build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi
          mkdir -p android-dist
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out android-dist/Lumen-android.apk \
            "$APK"
          "$BT/apksigner" verify android-dist/Lumen-android.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          APK=$(find android -path "*build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Debug APK not found"
            exit 1
          fi
          mkdir -p android-dist
          cp "$APK" android-dist/Lumen-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-android
          path: android-dist/Lumen-android.apk

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Lumen ${{ env.RELEASE_TAG }}"
          body_path: CHANGELOG.md
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: android-dist/Lumen-android.apk
